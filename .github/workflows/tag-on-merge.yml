name: Release
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        run: pyinstaller --onefile sinkhole.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinkhole-${{ matrix.os }}
          path: dist/sinkhole*

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get version from __version__.py
        id: version
        run: echo "tag=$(python -c "import __version__; print(__version__.__version__)")" >> $GITHUB_OUTPUT
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "all-artifacts/*/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: "Automated release for version ${{ steps.version.outputs.tag }}"