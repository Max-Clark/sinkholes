name: Tag on merge
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Get version from __version__.py
        id: version
        run: echo "::set-output name=tag::$(python -c "import __version__; print(__version__.__version__)")"
      - name: Create tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          custom_tag: "${{ steps.version.outputs.tag }}"

  build:
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        run: pyinstaller --onefile sinkhole.py
      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: sinkhole-${{ matrix.os }}
          path: dist/sinkhole*
